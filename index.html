<style>
  :root {
    --bg: #FFFFFF;
    --ink: #0B0B0F;      /* text */
    --soft: #6E6E78;     /* quiet text */
    --tag: #1620FF;      /* sticker background */
    --tagtext: #FFFFFF;  /* sticker text */
    --pop: #FF3B14;      /* sticker shadow */
    --display: "Gabarito", system-ui, sans-serif;
    --track: -.03em;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  ::selection { background: var(--tag); color: var(--tagtext); }
  html, body { margin: 0; }
  body {
    min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--ink);
    font-family: var(--display);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .wrap { width: 100%; max-width: 1040px; margin: 0 auto; padding: 0 max(20px, env(safe-area-inset-right)) 0 max(20px, env(safe-area-inset-left)); }

  header.wrap { padding-top: max(24px, calc(env(safe-area-inset-top) + 12px)); display: flex; justify-content: space-between; align-items: center; }
  header .ic { width: 40px; height: 40px; margin-right: -8px; }
  header .ic svg { width: 20px; height: 20px; }
  .logo { font-weight: 800; font-size: 20px; line-height: 1; letter-spacing: -.03em; color: var(--ink); text-decoration: none; }

  main { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 4vh 0 6vh; }
  h1 {
    font-weight: 800;
    font-size: clamp(28px, 9.4vw, 96px); line-height: 1.04; letter-spacing: var(--track); margin: 0 0 30px;
  }
  h1 .line { display: block; white-space: nowrap; }
  .slot { display: inline-flex; justify-content: center; vertical-align: baseline; transition: width .5s cubic-bezier(.4,0,.2,1); }
  .rot { display: inline-flex; white-space: nowrap; align-items: baseline; gap: .16em; transition: opacity .35s ease, transform .35s ease, filter .35s ease; }
  .rot.out { opacity: 0; transform: translateY(-.22em); filter: blur(8px); }
  .rot.pre { opacity: 0; transform: translateY(.22em); filter: blur(8px); transition: none; }
  .verb { display: inline-block; color: var(--tagtext); background: var(--tag); padding: .02em .22em .06em; border-radius: .28em; transform: rotate(-3deg); box-shadow: .07em .07em 0 var(--pop); }
  .emo { letter-spacing: 0; }

  .contact { display: inline-flex; align-items: center; gap: 4px; font: 500 14px/1.2 var(--mono); }
  .addr { margin-right: 6px; user-select: all; }
  .ic { display: inline-grid; place-items: center; width: 34px; height: 34px; padding: 0; border: 0; border-radius: 9px; background: transparent; color: var(--soft); cursor: pointer; text-decoration: none; transition: background .15s, color .15s; }
  .ic:hover { background: #F1F1F4; color: var(--tag); }
  .ic:focus-visible { outline: 2px solid var(--tag); outline-offset: 2px; }
  .ic svg { width: 17px; height: 17px; display: block; }
  .ic .ok { display: none; }
  .ic.done { color: var(--tag); }
  .ic.done .cp { display: none; }
  .ic.done .ok { display: block; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  footer.wrap { padding-bottom: max(28px, env(safe-area-inset-bottom)); font: 500 11px/1.4 var(--mono); color: var(--soft); text-transform: uppercase; letter-spacing: .08em; }
  footer .in { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 10px 22px; }
  .city { display: inline-flex; align-items: center; gap: 7px; }
  .flag { width: 16px; height: 11px; border-radius: 2px; display: block; box-shadow: 0 0 0 1px rgba(11,11,15,.14); }
  .flag.sq { width: 11px; }

  .reveal { opacity: 0; transform: translateY(14px); animation: up .7s ease forwards; }
  .d1 { animation-delay: .08s } .d2 { animation-delay: .18s }
  @keyframes up { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .reveal { animation: none; opacity: 1; transform: none; } .ic, .rot, .slot { transition: none; } }
</style>
</head>
<body>
  <header class="wrap">
    <a class="logo" href="/" aria-label="BSR Labs">BSR Labs</a>
    <a class="ic" href="mailto:contact@bsrlabs.xyz" aria-label="Email us" title="Email us">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3.500 7.500l8.500 6 8.500-6"/></svg>
    </a>
  </header>

  <main class="wrap">
    <div>
      <h1 class="reveal d1" aria-label="We build, market and monetize b2c mobile apps">
        <span class="line" aria-hidden="true">We <span class="slot" id="slot"><span class="rot" id="rot"><span class="verb" id="verb">build</span><span class="emo" id="emo">🧮</span></span></span></span>
        <span class="line" aria-hidden="true">b2c mobile apps</span>
      </h1>
      <div class="contact reveal d2">
        <span class="addr">contact@bsrlabs.xyz</span>
        <button class="ic" id="copy" type="button" aria-label="Copy email address" title="Copy">
          <svg class="cp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15V5.5A2.5 2.5 0 0 1 7.5 3H15"/></svg>
          <svg class="ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </button>
        <a class="ic" href="mailto:contact@bsrlabs.xyz" aria-label="Open in your mail app" title="Open in mail">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.500v-11A1.5 1.5 0 0 1 5.500 6H10"/></svg>
        </a>
        <span class="sr" id="live" aria-live="polite"></span>
      </div>
    </div>
  </main>

  <footer class="wrap">
    <div class="in">
      <span class="city"><svg class="flag" viewBox="0 0 24 16" aria-hidden="true"><rect width="24" height="16" fill="#fff"/><rect x="6" width="18" height="5.34" fill="#00732F"/><rect x="6" y="10.66" width="18" height="5.34" fill="#000"/><rect width="6" height="16" fill="#FF0000"/></svg>Dubai</span>
      <span class="city"><svg class="flag sq" viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" fill="#DA291C"/><rect x="6.500" y="3" width="3" height="10" fill="#fff"/><rect x="3" y="6.500" width="10" height="3" fill="#fff"/></svg>Geneva</span>
      <span class="city"><svg class="flag" viewBox="0 0 24 16" aria-hidden="true"><rect width="8" height="16" fill="#0055A4"/><rect x="8" width="8" height="16" fill="#fff"/><rect x="16" width="8" height="16" fill="#EF4135"/></svg>Paris</span>
      <span>&copy; <span id="y">2026</span> BSR Labs</span>
    </div>
  </footer>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();

    /* mailto: opens the default mail app. If nothing happens (no mail app set up on desktop), fall back to a Gmail compose window. */
    (function () {
      var email = 'contact@bsrlabs.xyz';
      var mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      document.querySelectorAll('a[href^="mailto:"]').forEach(function (a) {
        a.addEventListener('click', function () {
          if (mobile) return;
          var left = false;
          function onBlur() { left = true; }
          window.addEventListener('blur', onBlur, { once: true });
          setTimeout(function () {
            window.removeEventListener('blur', onBlur);
            if (!left && !document.hidden) {
              window.open('https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(email), '_blank', 'noopener');
            }
          }, 900);
        });
      });
    })();

    (function () {
      var btn = document.getElementById('copy');
      var live = document.getElementById('live');
      var email = 'contact@bsrlabs.xyz';
      function done() {
        btn.classList.add('done');
        live.textContent = 'Email address copied';
        setTimeout(function () { btn.classList.remove('done'); live.textContent = ''; }, 1600);
      }
      function fallback() {
        var t = document.createElement('textarea');
        t.value = email; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
        document.body.appendChild(t); t.select();
        try { document.execCommand('copy'); done(); } catch (e) {}
        document.body.removeChild(t);
      }
      btn.addEventListener('click', function () {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(email).then(done, fallback);
        } else { fallback(); }
      });
    })();

    (function () {
      var words = [['build', '🧮'], ['market', '🚀'], ['monetize', '🤑']];
      var i = 0;
      var rot = document.getElementById('rot');
      var verb = document.getElementById('verb');
      var emo = document.getElementById('emo');
      var slot = document.getElementById('slot');
      function next() {
        rot.classList.add('out');
        setTimeout(function () {
          var w0 = slot.getBoundingClientRect().width;
          i = (i + 1) % words.length;
          verb.textContent = words[i][0];
          emo.textContent = words[i][1];
          /* glide the slot from the old width to the new one so "We" slides instead of jumping */
          slot.style.width = '';
          var w1 = slot.getBoundingClientRect().width;
          slot.style.width = w0 + 'px';
          void slot.offsetWidth;
          slot.style.width = w1 + 'px';
          setTimeout(function () { slot.style.width = ''; }, 600);
          rot.classList.remove('out');
          rot.classList.add('pre');
          void rot.offsetWidth;
          rot.classList.remove('pre');
          setTimeout(next, 5000);
        }, 350);
      }
      setTimeout(next, 5000);
    })();
  </script>
</body>
